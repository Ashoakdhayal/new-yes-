<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .mcq-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e0e4ef;
      padding: 2rem;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .mcq-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      background: #e8f0fe;
      color: #1a56db;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .mcq-question {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a2e;
      line-height: 1.65;
      margin-bottom: 1.4rem;
    }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: #f8f9fc;
      border: 1.5px solid #e0e4ef;
      border-radius: 10px;
      padding: 13px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      color: #2d2d2d;
      transition: border-color 0.15s, background 0.15s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: #1a56db;
      background: #eef3ff;
    }

    .opt-btn:disabled { cursor: default; }

    .opt-btn.correct {
      background: #e6f9f0;
      border-color: #22c55e;
      color: #15803d;
    }

    .opt-btn.wrong {
      background: #fff0f0;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .opt-btn.reveal {
      background: #e6f9f0;
      border-color: #22c55e;
      color: #15803d;
    }

    .opt-label {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #c7cde0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      background: #fff;
    }

    .opt-btn.correct .opt-label,
    .opt-btn.reveal .opt-label {
      border-color: #22c55e;
      background: #dcfce7;
      color: #15803d;
    }

    .opt-btn.wrong .opt-label {
      border-color: #ef4444;
      background: #fee2e2;
      color: #b91c1c;
    }

    .feedback {
      margin-top: 1.1rem;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }

    .feedback.correct {
      background: #e6f9f0;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .feedback.wrong {
      background: #fff0f0;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .reset-btn {
      margin-top: 1rem;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      transition: background 0.15s;
    }

    .reset-btn:hover { background: #f3f4f6; }
  </style>
</head>
<body>

  <div class="mcq-card">
    <span class="mcq-badge" id="qBadge">सामान्य विज्ञान</span>
    <p class="mcq-question" id="qText"></p>
    <div id="options"></div>
    <div id="feedback" style="display:none"></div>
    <button class="reset-btn" id="resetBtn" style="display:none" onclick="resetQ()">↺ फिर से प्रयास करें</button>
  </div>

  <script>
    const question = {
      badge: "सामान्य विज्ञान",
      text: "पृथ्वी अपनी धुरी पर एक पूरा चक्कर कितने समय में लगाती है?",
      options: [
        "12 घंटे",
        "24 घंटे",
        "365 दिन",
        "30 दिन"
      ],
      correct: 1,
      explanation: "पृथ्वी अपनी धुरी (Axis) पर 24 घंटे में एक पूरा चक्कर लगाती है, जिससे दिन और रात बनते हैं। 365 दिन पृथ्वी का सूर्य के चारों ओर चक्कर लगाने का समय है।"
    };

    const labels = ["A", "B", "C", "D"];
    let answered = false;

    function render() {
      document.getElementById("qBadge").textContent = question.badge;
      document.getElementById("qText").textContent = question.text;
      const cont = document.getElementById("options");
      cont.innerHTML = "";
      question.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.id = "opt_" + i;
        btn.onclick = () => selectAnswer(i);
        btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${opt}</span>`;
        cont.appendChild(btn);
      });
    }

    function selectAnswer(i) {
      if (answered) return;
      answered = true;
      const isCorrect = i === question.correct;
      document.querySelectorAll(".opt-btn").forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === i && isCorrect) btn.classList.add("correct");
        else if (idx === i) btn.classList.add("wrong");
        else if (idx === question.correct) btn.classList.add("reveal");
      });
      const fb = document.getElementById("feedback");
      fb.style.display = "block";
      fb.className = "feedback " + (isCorrect ? "correct" : "wrong");
      fb.innerHTML = (isCorrect
        ? `<strong>✅ सही जवाब!</strong>`
        : `<strong>❌ गलत जवाब।</strong>`)
        + question.explanation;
      document.getElementById("resetBtn").style.display = "inline-block";
    }

    function resetQ() {
      answered = false;
      document.getElementById("feedback").style.display = "none";
      document.getElementById("resetBtn").style.display = "none";
      render();
    }

    render();
  </script>

</body>
</html>
